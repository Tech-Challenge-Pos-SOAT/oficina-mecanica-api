name: CD (GKE)

# Entrega continua independente da main: todo push na branch deploy-google-cloud
# roda os testes, builda a imagem, publica no Artifact Registry e faz o deploy
# no GKE. Como o gatilho e o proprio push, o workflow vale a partir do commit
# da branch (nao precisa estar na main, ao contrario do gatilho workflow_run) e
# nao espera o CI completo (Dependency-Check, Trivy, Sonar), que e lento.
# A autenticacao e' por Workload Identity Federation (sem chave JSON de
# service account). Enquanto as variaveis do GCP nao estiverem cadastradas,
# o job de deploy fica "skipped".

on:
  push:
    branches: [deploy-google-cloud]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gke
  cancel-in-progress: false

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Testes (unitarios e integracao)
        run: mvn -B test

  deploy:
    name: Build, push e deploy no GKE
    needs: test
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      CLUSTER: ${{ vars.GKE_CLUSTER }}
      INSTANCE_CONNECTION_NAME: ${{ vars.CLOUDSQL_CONNECTION_NAME }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/oficina/oficina-mecanica-api
    steps:
      - name: Checkout (commit que passou nos testes)
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Login do Docker no Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build e push da imagem
        run: |
          TAG="${{ github.sha }}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Credenciais do cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Preparar manifestos (placeholders e imagem)
        run: |
          sed -i "s|__PROJECT_ID__|${PROJECT_ID}|g" k8s/serviceaccount.yaml
          sed -i "s|__INSTANCE_CONNECTION_NAME__|${INSTANCE_CONNECTION_NAME}|g" k8s/configmap.yaml
          if [ -n "${MAIL_FROM}" ]; then
            sed -i "s|seu-email-remetente@exemplo.com|${MAIL_FROM}|g" k8s/configmap.yaml
          fi
          cd k8s
          kustomize edit set image "oficina-mecanica-api=${IMAGE}:${TAG}"

      - name: Namespace e Secret (a partir dos GitHub Secrets)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n oficina create secret generic oficina-api-secret \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=BREVO_SMTP_USERNAME="${{ secrets.BREVO_SMTP_USERNAME }}" \
            --from-literal=BREVO_SMTP_PASSWORD="${{ secrets.BREVO_SMTP_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: kubectl apply -k k8s/

      - name: Aguardar o rollout
        run: kubectl -n oficina rollout status deployment/oficina-api --timeout=300s

      - name: Resumo do deploy
        run: |
          {
            echo "### Deploy no GKE"
            echo "Imagem: \`${IMAGE}:${TAG}\`"
            echo
            echo '```'
            kubectl -n oficina get deploy,hpa,svc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
