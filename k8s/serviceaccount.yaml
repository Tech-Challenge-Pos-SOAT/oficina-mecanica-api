# ServiceAccount do Kubernetes ligada a uma service account do Google via
# Workload Identity: e' ela que da ao sidecar do Cloud SQL Auth Proxy a
# permissao roles/cloudsql.client, sem nenhuma chave JSON dentro do cluster.
# __PROJECT_ID__ e' trocado pelo pipeline (ou por voce, no primeiro deploy manual).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  namespace: oficina
  annotations:
    iam.gke.io/gcp-service-account: oficina-api@__PROJECT_ID__.iam.gserviceaccount.com
