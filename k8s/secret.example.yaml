# MODELO. Nao aplique este arquivo com valores reais nem o commite preenchido.
# O pipeline cria o Secret "oficina-api-secret" a partir dos GitHub Secrets; para
# um deploy manual:
#
#   kubectl -n oficina create secret generic oficina-api-secret \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=BREVO_SMTP_USERNAME='...' \
#     --from-literal=BREVO_SMTP_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
  namespace: oficina
type: Opaque
stringData:
  DB_PASSWORD: trocar
  JWT_SECRET: trocar-por-um-segredo-longo-e-aleatorio
  BREVO_SMTP_USERNAME: trocar
  BREVO_SMTP_PASSWORD: trocar
