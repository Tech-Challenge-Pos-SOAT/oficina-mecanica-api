spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_mecanica}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
      file: docker-compose.yml
      lifecycle-management: start-and-stop

  mail:
    host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mail:
  from: ${MAIL_FROM:}

server:
  port: 8080

# Actuator: so' health e info ficam expostos. O filtro JWT cobre apenas /api/*,
# entao /actuator/** e' publico (probes do Kubernetes nao carregam token).
# Liveness (/actuator/health/liveness) e readiness (/actuator/health/readiness)
# sao os endpoints usados pelo Deployment; readiness inclui o banco.
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:dev-only-oficina-mecanica-api-jwt-signing-secret-troque-em-producao-32bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

serviceorder:
  # Prazo, em dias, para o cliente responder ao orcamento enviado.
  budget-approval-deadline-days: ${BUDGET_APPROVAL_DEADLINE_DAYS:7}
  # Varredura diaria as 03:00 (America/Sao_Paulo).
  budget-expiration-cron: ${BUDGET_EXPIRATION_CRON:0 0 3 * * *}
