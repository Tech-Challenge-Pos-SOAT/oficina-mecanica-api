spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: jdbc:postgresql://localhost:5432/oficina_mecanica
    username: oficina
    password: oficina

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start-and-stop

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
